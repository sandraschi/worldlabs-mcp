[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worldlabs-mcp"
version = "0.3.0"
description = "MCP server wrapping the World Labs Marble API for 3D world generation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Sandra Schipal", email = "sandra@sandraschi.dev"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["mcp", "worldlabs", "marble", "3d", "world-generation", "ai", "spatial-intelligence"]

dependencies = [
    "fastmcp>=3.1.0,<4",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.3",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/sandraschi/worldlabs-mcp"
Documentation = "https://github.com/sandraschi/worldlabs-mcp#readme"
Issues = "https://github.com/sandraschi/worldlabs-mcp/issues"
Source = "https://github.com/sandraschi/worldlabs-mcp"

[project.scripts]
worldlabs-mcp = "worldlabs_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["worldlabs_mcp", "worldlabs_mcp.*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["fastmcp.*", "httpx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
