[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worldlabs-mcp"
version = "0.5.0"
description = "Generate navigable 3D worlds from text, images, and video via the World Labs Marble API"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Sandra Schipal", email = "sandraschipal@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["mcp", "worldlabs", "marble", "3d", "world-generation", "ai", "spatial-intelligence", "spark", "gaussian-splatting"]

dependencies = [
    "fastmcp>=3.4.4,<4",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "prefab-ui>=0.18.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
tts = ["edge-tts>=6.1.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.16.0,<0.17",
    "mypy>=1.0",
    "pyinstaller>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/sandraschi/worldlabs-mcp"
Documentation = "https://github.com/sandraschi/worldlabs-mcp#readme"
Issues = "https://github.com/sandraschi/worldlabs-mcp/issues"
Source = "https://github.com/sandraschi/worldlabs-mcp"

[project.scripts]
worldlabs-mcp = "worldlabs_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["worldlabs_mcp", "worldlabs_mcp.*"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["fastmcp.*", "httpx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF", "T20"]
ignore = ["S101", "B008", "S106", "S110", "S112", "S101", "B008", "S106", "S110", "S112", "RUF012", "S603", "S607", "S324", "E402", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["T20"]
"scripts/**/*" = ["T20"]
"competition/**/*" = ["T20"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.16.0,<0.17",
    "mypy>=1.0",
    "pyright>=1.1.390",
    "pyinstaller>=6.21.0",
    "pywin32>=311",
]


[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
