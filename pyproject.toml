[project]
name = "worldlabs-mcp"
version = "0.1.0"
description = "MCP server wrapping the World Labs Marble API for 3D world generation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "sandraschi" }]
keywords = ["mcp", "worldlabs", "marble", "3d", "world-generation", "ai", "spatial-intelligence"]

dependencies = [
    "fastmcp>=2.12.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[project.scripts]
worldlabs-mcp = "worldlabs_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
