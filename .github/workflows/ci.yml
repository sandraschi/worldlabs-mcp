name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Sync dev dependencies
        run: uv sync --group dev

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Test with pytest
        run: uv run pytest -x --tb=short -k "not slow"
